<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101326">
  <title>QUIZORA — تحديث مؤقت</title>
  <style>
    :root{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#f5f2fb;background:#101326}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;padding:24px;place-items:center;background:radial-gradient(ellipse at 50% 0,#452d4d 0,transparent 58%),#101326}
    main{width:min(100%,520px);padding:46px 38px;border:1px solid #ffffff1c;border-radius:26px;background:#19192be8;box-shadow:0 28px 80px #08071280;text-align:center}
    .mark{display:grid;width:64px;height:64px;margin:0 auto 22px;place-items:center;border:1px solid #d6a8e655;border-radius:20px;background:#9c65a51f;color:#e5c4ed;font-size:30px;font-weight:900}
    .eyebrow{margin:0 0 12px;color:#d0a8db;font-size:12px;font-weight:800;letter-spacing:.12em}
    h1{margin:0;font-size:clamp(25px,6vw,34px)}
    .message{margin:14px 0 0;color:#c3bdce;font-size:15px;line-height:1.9}
    .status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:9px 13px;border:1px solid #d6a8e633;border-radius:999px;background:#9c65a516;color:#e1c3e8;font-size:12px}
    .status::before{width:7px;height:7px;border-radius:50%;background:#c795d3;box-shadow:0 0 10px #c795d3;content:""}
    .version{margin:26px 0 0;color:#858093;font-size:11px;direction:ltr}
    @media(max-width:480px){body{padding:16px}main{padding:38px 23px;border-radius:22px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Q</div>
    <p class="eyebrow">QUIZORA</p>
    <h1>الموقع متوقف مؤقتًا</h1>
    <p class="message">نعمل على تحديث الموقع وتحسينه. يرجى المحاولة مرة أخرى بعد قليل.</p>
    <span class="status">سيعود الموقع للعمل قريبًا</span>
    <p class="version">v1.2.1</p>
  </main>
</body>
</html>
