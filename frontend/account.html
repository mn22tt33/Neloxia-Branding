<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#493849">
  <title>حساب QUIZORA</title>
  <style>
    :root{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#302b31;background:#f3efe9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center}
    main{width:min(100%,440px);padding:30px;background:#fffcf8;border:1px solid #e6ded9;border-radius:22px;box-shadow:0 20px 50px #3027351f;text-align:center}
    .mark{width:60px;height:60px;margin:0 auto 15px;display:grid;place-items:center;border-radius:18px;background:#493849;color:#fff;font-size:23px;font-weight:900}
    h1{margin:0;font-size:24px}p{color:#706972;line-height:1.8}
    .notice{margin:16px 0;padding:12px;border-radius:12px;background:#f6ebdd;color:#805832;font-size:13px}
    #googleButton{display:flex;width:100%;justify-content:center;align-items:center;gap:10px;min-height:46px;margin:20px 0;padding:10px 16px;border:1px solid #d5ced4;border-radius:11px;background:#fff;color:#302b31;font:inherit;font-weight:700;cursor:pointer}
    #googleButton[hidden]{display:none}
    #googleButton:disabled{opacity:.6;cursor:wait}
    .google-g{font:bold 20px Arial,sans-serif;color:#4285f4}
    #message{min-height:1.5em;color:#9b4e56;font-size:13px}
    #userCard{padding:14px;border:1px solid #e6ded9;border-radius:13px;background:#faf6f1}
    #userCard[hidden]{display:none}
    button,.link{display:inline-flex;justify-content:center;align-items:center;min-height:42px;padding:10px 16px;border:0;border-radius:11px;background:#493849;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .link{margin-top:16px;background:transparent;color:#705a72}
    @media(max-width:480px){body{padding:14px}main{padding:24px 18px}}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">Q</div>
  <h1>حساب QUIZORA</h1>
  <p>سجّل الدخول أو أنشئ حسابك باختيار حساب Google الموجود على جهازك.</p>
  <div id="availability" class="notice" role="status">جارٍ التحقق من إعداد تسجيل الدخول…</div>
  <button id="googleButton" type="button" hidden><span class="google-g" aria-hidden="true">G</span>المتابعة باستخدام Google</button>
  <p id="message" aria-live="polite"></p>
  <section id="userCard" hidden>
    <p id="currentUser"></p>
    <button id="logout" type="button">تسجيل الخروج</button>
  </section>
  <a class="link" href="/">العودة إلى QUIZORA</a>
</main>
<script src="/config.js?v=1.2.0"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    getRedirectResult,
    signInWithPopup,
    signInWithRedirect,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const config = window.APP_CONFIG || {};
  const base = (config.apiBaseUrl || "").replace(/\/+$/, "");
  const message = document.getElementById("message");
  const availability = document.getElementById("availability");
  const button = document.getElementById("googleButton");
  const userCard = document.getElementById("userCard");
  const firebaseConfig = config.firebase;
  const requestedNext = new URLSearchParams(location.search).get("next") || "/";
  let next = "/";
  try {
    const nextUrl = new URL(requestedNext, location.origin);
    if (nextUrl.origin === location.origin) {
      next = nextUrl.pathname + nextUrl.search + nextUrl.hash;
    }
  } catch (error) {
    console.warn("تجاهل رابط العودة غير الصالح.", error);
  }

  function api(path, method, data) {
    return fetch(base + path, {
      method: method || "GET",
      credentials: "include",
      cache: "no-store",
      headers: data ? {"Content-Type": "application/json"} : {},
      body: data ? JSON.stringify(data) : undefined
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (payload) {
        if (!response.ok) throw new Error(payload.message || "تعذّر إتمام الطلب.");
        return payload;
      });
    });
  }

  function showSignIn() {
    button.hidden = false;
    button.disabled = false;
  }

  function showUser(user) {
    if (!user) return;
    document.getElementById("currentUser").textContent =
      user.full_name + " — " + user.email;
    userCard.hidden = false;
    button.hidden = true;
  }

  function showSignInError(error) {
    const messages = {
      "auth/unauthorized-domain": "أضف نطاق الواجهة إلى النطاقات المسموح بها في Firebase Authentication.",
      "auth/operation-not-allowed": "فعّل مزوّد Google من Firebase Authentication.",
      "auth/popup-closed-by-user": "أُغلقت نافذة اختيار حساب Google قبل اكتمال الدخول.",
      "auth/network-request-failed": "تعذّر الاتصال بـGoogle؛ تحقق من الإنترنت وحاول مجددًا."
    };
    message.textContent = messages[error.code] || error.message || "تعذّر تسجيل الدخول باستخدام Google.";
  }

  const app = firebaseConfig ? initializeApp(firebaseConfig) : null;
  const auth = app ? getAuth(app) : null;
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({prompt: "select_account"});
  if (auth) auth.languageCode = "ar";

  async function finishSignIn(user) {
    message.textContent = "جارٍ التحقق من حساب Google…";
    button.disabled = true;
    try {
      const idToken = await user.getIdToken();
      await api("/api/auth/firebase/login", "POST", {id_token: idToken});
      try {
        await signOut(auth);
      } catch (error) {
        console.warn("تعذّر إنهاء جلسة Firebase المحلية.", error);
      }
      location.replace(next);
    } catch (error) {
      showSignInError(error);
      showSignIn();
    }
  }

  button.addEventListener("click", async function () {
    button.disabled = true;
    message.textContent = "جارٍ فتح حسابات Google…";
    try {
      if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
        await signInWithRedirect(auth, provider);
        return;
      }
      const result = await signInWithPopup(auth, provider);
      await finishSignIn(result.user);
    } catch (error) {
      showSignInError(error);
      showSignIn();
    }
  });

  document.getElementById("logout").addEventListener("click", function () {
    api("/api/auth/logout", "POST", {}).then(function () {
      userCard.hidden = true;
      message.textContent = "تم تسجيل الخروج.";
      showSignIn();
    }).catch(function (error) {
      message.textContent = error.message;
    });
  });

  async function initializeAccountPage() {
    if (!firebaseConfig || !auth) {
      availability.textContent = "إعداد Firebase غير موجود في الواجهة.";
      return;
    }
    const status = await api("/api/auth/status");
    if (!status.enabled) {
      availability.textContent = status.message || "تسجيل الدخول غير مفعّل حاليًا.";
      return;
    }
    availability.textContent = "تسجيل آمن باستخدام Google.";

    let redirectResult = null;
    try {
      redirectResult = await getRedirectResult(auth);
    } catch (error) {
      showSignInError(error);
    }
    if (redirectResult && redirectResult.user) {
      await finishSignIn(redirectResult.user);
      return;
    }

    const result = await api("/api/auth/me");
    if (result.user) {
      showUser(result.user);
    } else {
      showSignIn();
    }
  }

  initializeAccountPage().catch(function (error) {
    availability.textContent = error.message || "تعذّر الاتصال بخدمة الحسابات.";
    showSignIn();
  });
</script>
</body>
</html>
